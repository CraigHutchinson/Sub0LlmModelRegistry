[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sub0llmregistry"
version = "0.1.0"
description = "A versioned, manifest-described folder of LLM weights, with provider plugins for fetching models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["sub0platform @ git+https://github.com/CraigHutchinson/Sub0Platform@v0.1.0"]

[project.scripts]
sub0llmregistry = "sub0llmregistry.__main__:main"

[tool.setuptools.packages.find]
include = ["sub0llmregistry*"]
