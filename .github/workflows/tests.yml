# Registry tests on Windows and Linux: store, manifests, GGUF reader and disk use. Nothing is downloaded.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (pulls in Sub0Platform)
        run: python -m pip install .
      - name: Tests
        run: python -m unittest discover -s tests -v
